[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-qa"
version = "0.1.0"
description = "Automated QA of controls drawing packages (PLC, cable block and termination drawings)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "networkx>=3.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drawing-qa = "drawing_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_qa = ["report/*.html"]  # the system map page template

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
