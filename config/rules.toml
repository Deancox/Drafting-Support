# Per-rule settings. Read with config/project.toml at the start of every run.
# Every rule is enabled with its default severity unless listed here.
#
#   enabled  = false                    turn a rule off
#   severity = "CRITICAL" | "MAJOR" | "MINOR" | "INFO"
#
# Placeholder rules default to MAJOR on issued drawings (FOR CONSTRUCTION, AS BUILT)
# and MINOR on PRELIMINARY ones; setting a severity here fixes it for all drawings.

[rules."TAG-002"]
enabled = true   # no output until prefixes / ffis are listed in project.toml

# Example: report HOLD as MAJOR everywhere
# [rules."PLACEHOLDER-004"]
# severity = "MAJOR"
